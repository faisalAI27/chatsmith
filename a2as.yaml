files:
  cache_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(get_cache_path(url)), open, json.load]
  filepath:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(get_cache_path(url)), filepath.parent.mkdir, open, json.load]
  KNOWLEDGE_DIR:
    type: variable
    actions: [write]
    params:
      caller: [KNOWLEDGE_DIR.mkdir]
  LOG_PATH:
    type: literal
    actions: [read]
    params:
      caller: [Path(METRICS_LOG_PATH)]
  log_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(log_path), Path, log_path.parent.mkdir]
  METRICS_LOG_PATH:
    type: variable
    actions: [read]
    params:
      caller: [Path]

