agents:
  gap_detection_agent:
    type: instance
    models: [gpt-4o-mini]
    params:
      name: GapDetectionAgent
      output_type: GapAnalysis
      instructions: [You are a content analysis expert. You analyze extracted website content and determine if web searches
          are needed to fill gaps., 'Analyze the provided website content and determine:', '1. Is the content comprehensive
          enough for a chatbot to answer questions about this website?', '2. What specific information gaps exist (if any)?',
        '3. Should we run web searches to fill these gaps?', 'Be conservative - only recommend web searches if there are CLEAR
          gaps like:', '- No contact information found', '- Pricing/plans mentioned but not detailed', '- Services listed
          but not explained', '- Team/leadership mentioned but not detailed', '- Key product features missing', 'If the website
          content covers the basics (what they do, who they are, how to contact), NO web search is needed.']
  name_extractor:
    type: instance
    models: [gpt-4o-mini]
    params:
      name: NameExtractor
      output_type: NameExtraction
      instructions: ['You analyze the provided text and extract a single concise name that best represents the main subject
          (e.g., site/company/person/product). If a URL is provided, prefer the name associated with that URL. Return only
          the name, no extra words.']
  planner_agent:
    type: instance
    models: [gpt-4o-mini]
    params:
      name: PlannerAgent
      output_type: WebSearchPlan
      instructions: [PLANNER_INSTRUCTIONS]
  search_agent:
    type: instance
    models: [gpt-4o-mini]
    tools: [WebSearchTool]
    params:
      name: Search agent
      model_settings: ModelSettings(tool_choice=required)
      instructions: ['You are a research assistant. Given a search URL, you search the web for that URL and produce a concise
          summary of the results. The summary must 2-3 paragraphs and less than 300 words. Capture the main points. Write
          succintly, no need to have complete sentences or good grammar. This will be consumed by someone synthesizing a report,
          so it''s vital you capture the essence and ignore any fluff. Do not include any additional commentary other than
          the summary itself.']
  writer_agent:
    type: instance
    models: [gpt-4o-mini]
    params:
      name: WriterAgent
      output_type: ReportData
      instructions: ['You are a senior researcher tasked with writing a cohesive report for a research query About website
          URL. You will be provided with the original URL, and some initial research done by a research assistant.', 'You
          should first come up with an outline for the Detail report that describes the structure and flow of the report.
          Then, generate the report and return that as your final output.', 'The final output should be in markdown format,
          and it should be lengthy and detailed. Aim for 5-10 pages of content, at least 1000 words.']

models:
  gpt-4o-mini:
    type: literal
    agents: [search_agent, planner_agent, gap_detection_agent, writer_agent, name_extractor]

tools:
  WebSearchTool:
    type: module
    agents: [search_agent]
    params:
      search_context_size: low

